name: Publicar en GitHub Pages

# Build de producción y deploy a GitHub Pages en cada push a main (o a mano desde Actions).
#
# Requisito (una vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# La API CRUD (json-server) no corre en Pages: definir la variable de repo `VITE_API_URL`
# (Settings → Secrets and variables → Actions → Variables) con la URL de una API publicada.
# Sin ella, funcionan el login demo y la Pokédex (PokeAPI); el resto muestra el error inline.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un deploy a la vez; si llega otro push, el que está corriendo termina (no se corta a la mitad).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lee la versión de pnpm del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Con scripts: Vite necesita el binario de esbuild (aprobado en pnpm-workspace.yaml).
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_POKEAPI_URL: https://pokeapi.co/api/v2
        run: pnpm build

      # Pages no conoce las rutas de la SPA: con 404.html = index.html, entrar directo a
      # /<repo>/pokedex (o recargar ahí) carga la app y el router resuelve la ruta.
      - name: Fallback de la SPA
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publicar en Pages
      id-token: write # el deploy se autentica con OIDC, sin tokens guardados
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
