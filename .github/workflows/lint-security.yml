name: ESLint de seguridad

# Análisis estático (SAST) del código en `src/`: patrones peligrosos como `eval`,
# `innerHTML`/`dangerouslySetInnerHTML` o regex que pueden colgar el navegador.
# Usa su propia configuración (`eslint.security.config.js`), aparte del lint general.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # solo para comentar el resultado en el PR cuando falla

jobs:
  lint-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lee la versión de pnpm del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # ESLint no necesita los scripts de instalación de ningún paquete.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm lint:security
        id: scan
        # `shell: bash` activa pipefail: sin eso el `| tee` se come el exit code y el check nunca falla.
        shell: bash
        run: pnpm lint:security 2>&1 | tee "$RUNNER_TEMP/lint.log"

      # Si el lint falla, deja el reporte y qué hacer como comentario en el PR
      # (y en el resumen del run). Si ya había un comentario de este check, lo actualiza.
      - name: Comentar el resultado en el PR
        if: failure() && steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- lint-security -->"
            echo "### ❌ \`lint-security\` encontró un patrón inseguro en el código"
            echo
            echo "**Qué hacer:**"
            echo "- **Corregir el código** en el archivo y la línea que indica el reporte. Es lo esperado en casi todos los casos."
            echo "- **Inyección de HTML** (\`innerHTML\`, \`dangerouslySetInnerHTML\`): renderizar como texto o sanitizar antes."
            echo "- **Regex insegura:** reescribirla sin cuantificadores anidados, o validar por pasos en una función."
            echo "- **Caso revisado que no es un riesgo:** \`// eslint-disable-next-line <regla> -- motivo\` en esa línea. Sin motivo no pasa el review."
            echo "- Para verlo en local: \`pnpm lint:security\`."
            echo
            echo "<details open><summary>Reporte de ESLint</summary>"
            echo
            echo '```'
            sed "s#$GITHUB_WORKSPACE/##" "$RUNNER_TEMP/lint.log" | tail -c 50000
            echo '```'
            echo
            echo "</details>"
            echo
            echo "[Log completo]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [Cómo funciona este check]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/HEAD/README.md#checks-de-seguridad)"
          } > "$RUNNER_TEMP/comentario.md"
          cat "$RUNNER_TEMP/comentario.md" >> "$GITHUB_STEP_SUMMARY"
          previo=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- lint-security -->"))) | .id' | tail -n 1)
          if [ -n "$previo" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$previo" -F body=@"$RUNNER_TEMP/comentario.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comentario.md"
          fi
